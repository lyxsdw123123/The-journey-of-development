# 完整后端：Nginx + FastAPI + PostgreSQL + Redis
services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    depends_on:
      - api

  api:
    build: .
    expose:
      - "8000"
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/app
      REDIS_URL: redis://redis:6379

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest

volumes:
  postgres_data:
